name: Update Bear Sighting Data

on:
  schedule:
    # 毎日日本時間9:00に実行 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm install

      - name: Install script dependencies
        run: npm install
        working-directory: scripts

      - name: Run update script
        id: update
        run: npx tsx update-bear-data.ts
        working-directory: scripts

      - name: Format JSON with Biome
        run: npx biome format --write app/src/data/bear_sightings.json

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet app/src/data/bear_sightings.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add app/src/data/bear_sightings.json
          git commit -m "update bear sighting data $(date +'%Y-%m-%d')"
          git push
